<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <filter id="shadow-sm">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-md">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Artboard background -->
  <rect width="1000" height="480" fill="#f8fafc"/>

  <!-- Title -->
  <text x="24" y="36" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#0f172a">BADGES, PILLS &amp; CHIPS</text>

  <!-- ===================== SECTION A — ENTITY BADGES ===================== -->
  <g id="Component/EntityBadges">
    <text x="24" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8" font-weight="600" letter-spacing="0.5">ENTITY BADGE — px=10 py=3 radius=99px font=10px fw=600</text>

    <!-- Badge 1: Info -->
    <rect x="24" y="64" width="56" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="52" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">Info</text>

    <!-- Badge 2: Success / Aktif -->
    <rect x="96" y="64" width="52" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="122" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">Aktif</text>

    <!-- Badge 3: Warning / Pending -->
    <rect x="164" y="64" width="66" height="22" rx="11" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="197" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#c2410c" text-anchor="middle">Pending</text>

    <!-- Badge 4: Danger / Nonaktif -->
    <rect x="246" y="64" width="68" height="22" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="280" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="middle">Nonaktif</text>

    <!-- Annotation -->
    <text x="330" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#94a3b8">h=22px · rx=99 · px=10 py=3</text>
  </g>

  <!-- ===================== SECTION B — STATUS PILLS ===================== -->
  <g id="Component/StatusPills">
    <text x="24" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8" font-weight="600" letter-spacing="0.5">STATUS PILL — inline indicator</text>

    <!-- Pill 1: Draft -->
    <rect x="24" y="124" width="58" height="20" rx="10" fill="#f1f5f9"/>
    <circle cx="38" cy="134" r="3" fill="#94a3b8"/>
    <text x="46" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#64748b">Draft</text>

    <!-- Pill 2: Menunggu -->
    <rect x="96" y="124" width="80" height="20" rx="10" fill="#f1f5f9"/>
    <circle cx="110" cy="134" r="3" fill="#94a3b8"/>
    <text x="118" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#64748b">Menunggu</text>

    <!-- Pill 3: Proses -->
    <rect x="192" y="124" width="62" height="20" rx="10" fill="#fff7ed"/>
    <circle cx="206" cy="134" r="3" fill="#f97316"/>
    <text x="214" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#c2410c">Proses</text>

    <text x="270" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#94a3b8">dot 6×6 · px=8 py=2 · rx=99</text>
  </g>

  <!-- ===================== SECTION C — MINI STAT CHIPS ===================== -->
  <g id="Component/MiniStatChips">
    <text x="24" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8" font-weight="600" letter-spacing="0.5">MINI STAT CHIP — px=8 py=2 radius=99px font=9px</text>

    <!-- Filled -->
    <rect x="24" y="188" width="84" height="20" rx="10" fill="#4f63ff"/>
    <text x="66" y="201" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">#1 Trending</text>

    <!-- Outlined -->
    <rect x="124" y="188" width="84" height="20" rx="10" fill="none" stroke="#4f63ff" stroke-width="1"/>
    <text x="166" y="201" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#4f63ff" text-anchor="middle">#1 Trending</text>

    <!-- Chip row: 3 chips -->
    <text x="24" y="228" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#94a3b8">chip-row example:</text>
    <rect x="24" y="234" width="24" height="18" rx="9" fill="#4f63ff"/>
    <text x="36" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">#1</text>
    <rect x="56" y="234" width="62" height="18" rx="9" fill="#4f63ff"/>
    <text x="87" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">12K Views</text>
    <rect x="126" y="234" width="44" height="18" rx="9" fill="#4f63ff"/>
    <text x="148" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">↑ 8%</text>
  </g>

  <!-- ===================== SECTION D — SUMMARY COUNTER PILL ===================== -->
  <g id="Component/SummaryCounterPill">
    <text x="24" y="284" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8" font-weight="600" letter-spacing="0.5">SUMMARY COUNTER PILL</text>

    <rect x="24" y="292" width="72" height="28" rx="14" fill="#eef0ff"/>
    <text x="60" y="309" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#4f63ff" text-anchor="middle">42 item</text>

    <!-- With icon variant -->
    <rect x="112" y="292" width="96" height="28" rx="14" fill="#eef0ff"/>
    <text x="132" y="309" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#4f63ff">☰ 42 item</text>

    <text x="220" y="309" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#94a3b8">rx=16 · px=10 py=4 · bg=#eef0ff · text=#4f63ff</text>
  </g>

  <!-- ===================== SECTION E — MULTI-SELECT CHIPS ===================== -->
  <g id="Component/MultiSelectChips">
    <text x="24" y="354" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8" font-weight="600" letter-spacing="0.5">MULTI-SELECT CHIP (inside input trigger)</text>

    <!-- Input shell context -->
    <rect x="24" y="362" width="420" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Chip: Instagram × -->
    <rect x="36" y="371" width="84" height="22" rx="11" fill="#eef0ff"/>
    <text x="74" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#4f63ff" text-anchor="middle">Instagram</text>
    <text x="110" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#4f63ff" text-anchor="middle">×</text>

    <!-- Chip: TikTok × -->
    <rect x="132" y="371" width="68" height="22" rx="11" fill="#eef0ff"/>
    <text x="161" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#4f63ff" text-anchor="middle">TikTok</text>
    <text x="192" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#4f63ff" text-anchor="middle">×</text>

    <!-- Chip: YouTube × -->
    <rect x="212" y="371" width="74" height="22" rx="11" fill="#eef0ff"/>
    <text x="244" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#4f63ff" text-anchor="middle">YouTube</text>
    <text x="278" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#4f63ff" text-anchor="middle">×</text>

    <!-- Cursor/placeholder -->
    <text x="300" y="385" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">Tambah...</text>

    <text x="24" y="414" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#94a3b8">rx=99 · px=8 py=3 · bg=#eef0ff · text=#4f63ff · "×" close icon</text>
  </g>

  <!-- ===================== SECTION F — METRIC CHIP CARD ===================== -->
  <g id="Component/MetricChipCard">
    <text x="24" y="438" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8" font-weight="600" letter-spacing="0.5">METRIC CHIP CARD</text>

    <rect x="24" y="446" width="140" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="36" y="462" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8">Views</text>
    <text x="36" y="480" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#0f172a">148.2K</text>

    <!-- Variant with trend -->
    <rect x="180" y="446" width="160" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-sm)"/>
    <text x="192" y="462" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#94a3b8">Engagement Rate</text>
    <text x="192" y="480" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#0f172a">8.4% <tspan font-size="10" fill="#22c55e">↑</tspan></text>

    <text x="356" y="462" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#94a3b8">w=140px · h=56px · rx=12</text>
    <text x="356" y="474" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#94a3b8">p=12px · shadow-sm</text>
  </g>
</svg>
