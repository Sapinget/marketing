<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow-sm">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-md">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-xl">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000" flood-opacity="0.18"/>
    </filter>

    <!-- Shimmer gradient for skeleton loading animation -->
    <linearGradient id="shimmer-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e2e8f0" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#f1f5f9" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="1"/>
    </linearGradient>

    <!-- Shimmer overlay (diagonal sweep) -->
    <linearGradient id="shimmer-sweep" x1="-100%" y1="0%" x2="200%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Skeleton base color -->
    <linearGradient id="skel-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e2e8f0"/>
      <stop offset="50%"  stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <clipPath id="toast-entering-clip">
      <rect x="24" y="350" width="160" height="52"/>
    </clipPath>
    <clipPath id="toast-visible-clip">
      <rect x="196" y="350" width="160" height="52"/>
    </clipPath>
    <clipPath id="toast-exiting-clip">
      <rect x="368" y="350" width="160" height="52"/>
    </clipPath>
  </defs>

  <!-- Artboard background -->
  <rect width="1000" height="600" fill="#f8fafc"/>

  <!-- Page title -->
  <text x="24" y="36" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="1">TOAST NOTIFICATIONS &amp; SKELETON LOADING</text>
  <text x="24" y="52" font-size="10" fill="#94a3b8">Fixed bottom-center · p=12px 16px · radius=16px · shadow-xl · 4 semantic types</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SECTION A: TOAST NOTIFICATIONS -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g id="Section/ToastNotifications">
    <text x="24" y="72" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.5">TOAST — SEMANTIC TYPES</text>

    <!-- ── Toast 1: SUCCESS ── -->
    <g id="Component/Toast-Success">
      <rect x="24" y="80" width="320" height="52" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" filter="url(#shadow-xl)"/>

      <!-- Icon circle -->
      <circle cx="56" cy="106" r="12" fill="#22c55e"/>
      <!-- Checkmark -->
      <polyline points="50,106 54,110 62,100" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Text -->
      <text x="76" y="101" font-size="12" font-weight="600" fill="#15803d">Data berhasil disimpan</text>
      <text x="76" y="116" font-size="10" fill="#166534">Program baru telah ditambahkan ke sistem</text>

      <!-- Close button -->
      <text x="330" y="110" font-size="11" fill="#15803d" text-anchor="middle">✕</text>

      <!-- Label -->
      <text x="24" y="143" font-size="8" font-weight="700" fill="#15803d">SUCCESS</text>
      <text x="24" y="153" font-size="8" fill="#94a3b8">fill: #f0fdf4 · stroke: #bbf7d0 · icon: #22c55e</text>
    </g>

    <!-- ── Toast 2: ERROR ── -->
    <g id="Component/Toast-Error">
      <rect x="24" y="164" width="320" height="52" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="1" filter="url(#shadow-xl)"/>

      <!-- Icon circle -->
      <circle cx="56" cy="190" r="12" fill="#ef4444"/>
      <!-- X icon -->
      <line x1="51" y1="185" x2="61" y2="195" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="61" y1="185" x2="51" y2="195" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

      <!-- Text -->
      <text x="76" y="185" font-size="12" font-weight="600" fill="#b91c1c">Terjadi kesalahan</text>
      <text x="76" y="200" font-size="10" fill="#991b1b">Gagal menyimpan data, coba lagi</text>

      <!-- Close button -->
      <text x="330" y="194" font-size="11" fill="#b91c1c" text-anchor="middle">✕</text>

      <!-- Label -->
      <text x="24" y="227" font-size="8" font-weight="700" fill="#b91c1c">ERROR</text>
      <text x="24" y="237" font-size="8" fill="#94a3b8">fill: #fef2f2 · stroke: #fecaca · icon: #ef4444</text>
    </g>

    <!-- ── Toast 3: INFO ── -->
    <g id="Component/Toast-Info">
      <rect x="24" y="248" width="320" height="52" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" filter="url(#shadow-xl)"/>

      <!-- Icon circle -->
      <circle cx="56" cy="274" r="12" fill="#3b82f6"/>
      <!-- Info icon -->
      <circle cx="56" cy="268" r="2" fill="#ffffff"/>
      <line x1="56" y1="272" x2="56" y2="280" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

      <!-- Text -->
      <text x="76" y="269" font-size="12" font-weight="600" fill="#1d4ed8">Data sedang diproses</text>
      <text x="76" y="284" font-size="10" fill="#1e40af">Harap tunggu beberapa saat</text>

      <!-- Close button -->
      <text x="330" y="278" font-size="11" fill="#1d4ed8" text-anchor="middle">✕</text>

      <!-- Label -->
      <text x="24" y="311" font-size="8" font-weight="700" fill="#1d4ed8">INFO</text>
      <text x="24" y="321" font-size="8" fill="#94a3b8">fill: #eff6ff · stroke: #bfdbfe · icon: #3b82f6</text>
    </g>

    <!-- ── Toast 4: WARNING ── -->
    <g id="Component/Toast-Warning">
      <rect x="24" y="332" width="320" height="52" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" filter="url(#shadow-xl)"/>

      <!-- Icon circle -->
      <circle cx="56" cy="358" r="12" fill="#f97316"/>
      <!-- Warning icon -->
      <text x="56" y="363" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>

      <!-- Text -->
      <text x="76" y="353" font-size="12" font-weight="600" fill="#c2410c">Sesi akan berakhir</text>
      <text x="76" y="368" font-size="10" fill="#9a3412">Harap simpan pekerjaan Anda sekarang</text>

      <!-- Close button -->
      <text x="330" y="362" font-size="11" fill="#c2410c" text-anchor="middle">✕</text>

      <!-- Label -->
      <text x="24" y="395" font-size="8" font-weight="700" fill="#c2410c">WARNING</text>
      <text x="24" y="405" font-size="8" fill="#94a3b8">fill: #fff7ed · stroke: #fed7aa · icon: #f97316</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- TOAST STATES: Entering / Visible / Exiting -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g id="Section/ToastStates">
    <text x="24" y="424" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.5">TOAST ANIMATION STATES</text>

    <!-- State 1: Entering -->
    <g id="State/Toast-Entering" opacity="0.5" transform="translate(0, -10)">
      <rect x="24" y="444" width="160" height="44" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <circle cx="48" cy="466" r="10" fill="#22c55e"/>
      <polyline points="43,466 47,470 53,460" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="64" y="462" font-size="9" font-weight="600" fill="#15803d">Berhasil disimpan</text>
      <text x="64" y="474" font-size="8" fill="#166534">Data tersimpan</text>
    </g>
    <text x="24" y="502" font-size="8" font-weight="700" fill="#94a3b8">ENTERING</text>
    <text x="24" y="512" font-size="8" fill="#94a3b8">translateY(10px)</text>
    <text x="24" y="522" font-size="8" fill="#94a3b8">opacity: 0 → 1</text>
    <text x="24" y="532" font-size="8" fill="#94a3b8">180ms ease-out</text>

    <!-- State 2: Visible -->
    <g id="State/Toast-Visible">
      <rect x="196" y="434" width="160" height="52" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" filter="url(#shadow-xl)"/>
      <circle cx="220" cy="460" r="12" fill="#22c55e"/>
      <polyline points="215,460 219,464 227,454" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="238" y="455" font-size="9" font-weight="600" fill="#15803d">Berhasil disimpan</text>
      <text x="238" y="467" font-size="8" fill="#166534">Data tersimpan</text>
    </g>
    <text x="196" y="502" font-size="8" font-weight="700" fill="#22c55e">VISIBLE</text>
    <text x="196" y="512" font-size="8" fill="#94a3b8">translateY(0)</text>
    <text x="196" y="522" font-size="8" fill="#94a3b8">opacity: 1</text>
    <text x="196" y="532" font-size="8" fill="#94a3b8">auto-dismiss: 4000ms</text>

    <!-- State 3: Exiting -->
    <g id="State/Toast-Exiting" opacity="0.3" transform="translate(0, -10)">
      <rect x="368" y="434" width="160" height="52" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <circle cx="392" cy="460" r="12" fill="#22c55e"/>
      <polyline points="387,460 391,464 399,454" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="410" y="455" font-size="9" font-weight="600" fill="#15803d">Berhasil disimpan</text>
      <text x="410" y="467" font-size="8" fill="#166534">Data tersimpan</text>
    </g>
    <text x="368" y="502" font-size="8" font-weight="700" fill="#94a3b8">EXITING</text>
    <text x="368" y="512" font-size="8" fill="#94a3b8">translateY(-10px)</text>
    <text x="368" y="522" font-size="8" fill="#94a3b8">opacity: 1 → 0</text>
    <text x="368" y="532" font-size="8" fill="#94a3b8">150ms ease-in</text>

    <!-- Position annotation -->
    <rect x="24" y="545" width="530" height="44" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="34" y="559" font-size="9" font-weight="700" fill="#92400e">POSITION:</text>
    <text x="88" y="559" font-size="9" fill="#92400e">fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999;</text>
    <text x="34" y="581" font-size="9" font-weight="700" fill="#92400e">STACKING:</text>
    <text x="94" y="581" font-size="9" fill="#92400e">multiple toasts stack vertically with gap=8px · max 4 visible at once</text>
  </g>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SECTION B: SKELETON LOADING -->
  <!-- ═══════════════════════════════════════════════════ -->
  <g id="Section/SkeletonLoading">
    <text x="596" y="72" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.5">SKELETON LOADING — shimmer shapes</text>

    <!-- ── 1. Text line full ── -->
    <g id="Component/Skeleton-TextFull">
      <rect x="596" y="84" width="380" height="12" rx="4" fill="#e2e8f0"/>
      <!-- Shimmer overlay -->
      <rect x="596" y="84" width="380" height="12" rx="4" fill="url(#shimmer-sweep)" opacity="0.7"/>
      <text x="984" y="95" font-size="8" fill="#94a3b8" text-anchor="end">Text line — full</text>
    </g>

    <!-- ── 2. Text line short ── -->
    <g id="Component/Skeleton-TextShort">
      <rect x="596" y="108" width="220" height="10" rx="4" fill="#e2e8f0"/>
      <rect x="596" y="108" width="220" height="10" rx="4" fill="url(#shimmer-sweep)" opacity="0.7"/>
      <text x="984" y="119" font-size="8" fill="#94a3b8" text-anchor="end">Text line — short (58%)</text>
      <!-- Measurement annotation -->
      <line x1="596" y1="126" x2="816" y2="126" stroke="#c7d2fe" stroke-width="1"/>
      <line x1="596" y1="122" x2="596" y2="130" stroke="#c7d2fe" stroke-width="1"/>
      <line x1="816" y1="122" x2="816" y2="130" stroke="#c7d2fe" stroke-width="1"/>
      <text x="706" y="138" font-size="7" fill="#94a3b8" text-anchor="middle">220px (variable)</text>
    </g>

    <!-- ── 3. Avatar circle ── -->
    <g id="Component/Skeleton-Avatar">
      <circle cx="620" cy="168" r="16" fill="#e2e8f0"/>
      <circle cx="620" cy="168" r="16" fill="url(#shimmer-sweep)" opacity="0.7"/>
      <text x="644" y="164" font-size="8" fill="#0f172a" font-weight="600">Avatar circle · 32×32</text>
      <text x="644" y="176" font-size="7" fill="#94a3b8">rx=50% · fill: #e2e8f0</text>
    </g>

    <!-- ── 4. Table row skeleton ── -->
    <g id="Component/Skeleton-TableRow">
      <text x="596" y="202" font-size="8" fill="#94a3b8">Table row skeleton</text>

      <!-- Row 1 (loading) -->
      <rect x="596" y="208" width="384" height="44" fill="#f8fafc"/>
      <line x1="596" y1="252" x2="980" y2="252" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Cell skeletons -->
      <rect x="604" y="220" width="40" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="652" y="220" width="140" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="800" y="220" width="100" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="908" y="220" width="60" height="10" rx="3" fill="#e2e8f0"/>
      <!-- Shimmer sweep across row -->
      <rect x="596" y="208" width="384" height="44" fill="url(#shimmer-sweep)" opacity="0.5"/>

      <!-- Row 2 (loading, slightly different widths) -->
      <rect x="596" y="252" width="384" height="44" fill="#f8fafc"/>
      <line x1="596" y1="296" x2="980" y2="296" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="604" y="264" width="40" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="652" y="264" width="110" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="800" y="264" width="80" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="908" y="264" width="48" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="596" y="252" width="384" height="44" fill="url(#shimmer-sweep)" opacity="0.5"/>

      <!-- Row 3 -->
      <rect x="596" y="296" width="384" height="44" fill="#f8fafc"/>
      <line x1="596" y1="340" x2="980" y2="340" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="604" y="308" width="40" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="652" y="308" width="130" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="800" y="308" width="90" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="908" y="308" width="52" height="10" rx="3" fill="#e2e8f0"/>
      <rect x="596" y="296" width="384" height="44" fill="url(#shimmer-sweep)" opacity="0.5"/>

      <!-- Column headers (lighter skeleton) -->
      <rect x="596" y="340" width="384" height="24" fill="#f1f5f9"/>
    </g>

    <!-- ── 5. Card block skeleton ── -->
    <g id="Component/Skeleton-Card">
      <text x="596" y="378" font-size="8" fill="#94a3b8">Card skeleton</text>

      <rect x="596" y="384" width="220" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Avatar skeleton -->
      <circle cx="620" cy="408" r="16" fill="#e2e8f0"/>

      <!-- Text lines -->
      <rect x="644" y="400" width="100" height="10" rx="4" fill="#e2e8f0"/>
      <rect x="644" y="418" width="72" height="8" rx="4" fill="#f1f5f9"/>

      <!-- Bottom text lines -->
      <rect x="608" y="444" width="196" height="10" rx="4" fill="#e2e8f0"/>
      <rect x="608" y="460" width="140" height="8" rx="4" fill="#f1f5f9"/>

      <!-- Shimmer overlay on card -->
      <rect x="596" y="384" width="220" height="100" rx="16" fill="url(#shimmer-sweep)" opacity="0.5"/>
    </g>

    <!-- ── 6. Button skeleton ── -->
    <g id="Component/Skeleton-Button">
      <text x="830" y="378" font-size="8" fill="#94a3b8">Button skeleton</text>

      <rect x="830" y="384" width="140" height="36" rx="16" fill="#e2e8f0"/>
      <rect x="830" y="384" width="140" height="36" rx="16" fill="url(#shimmer-sweep)" opacity="0.6"/>
    </g>

    <!-- ── Badge skeleton ── -->
    <g id="Component/Skeleton-Badge">
      <text x="830" y="432" font-size="8" fill="#94a3b8">Badge skeleton</text>
      <rect x="830" y="438" width="60" height="20" rx="10" fill="#e2e8f0"/>
      <rect x="830" y="438" width="60" height="20" rx="10" fill="url(#shimmer-sweep)" opacity="0.6"/>
    </g>

    <!-- ── Stat card skeleton ── -->
    <g id="Component/Skeleton-StatCard">
      <text x="830" y="472" font-size="8" fill="#94a3b8">Stat card</text>
      <rect x="830" y="478" width="140" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="842" y="490" width="80" height="10" rx="4" fill="#e2e8f0"/>
      <rect x="842" y="508" width="56" height="14" rx="4" fill="#e2e8f0"/>
      <rect x="830" y="478" width="140" height="64" rx="12" fill="url(#shimmer-sweep)" opacity="0.4"/>
    </g>

    <!-- Shimmer annotation -->
    <rect x="596" y="500" width="384" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <text x="606" y="516" font-size="9" font-weight="700" fill="#0f172a">Shimmer Animation</text>

    <!-- Shimmer example bar with annotation -->
    <rect x="606" y="522" width="280" height="12" rx="4" fill="#e2e8f0"/>
    <!-- The sweep overlay (static representation at mid-point) -->
    <rect x="700" y="522" width="80" height="12" rx="4" fill="url(#shimmer-gradient)"/>

    <text x="606" y="548" font-size="8" fill="#64748b" font-weight="600">CSS keyframes:</text>
    <text x="606" y="560" font-size="8" fill="#94a3b8">background-position: -200% → 200% (infinite)</text>
    <text x="606" y="572" font-size="8" fill="#94a3b8">opacity: 0.6 → 1 → 0.6 · duration: 1.5s · ease-in-out</text>
    <text x="606" y="584" font-size="8" fill="#94a3b8">background-size: 200% 100% · gradient sweep left→right</text>

    <!-- Arrow showing sweep direction -->
    <line x1="606" y1="530" x2="880" y2="530" stroke="#4f63ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
    <text x="843" y="527" font-size="8" fill="#4f63ff">→ sweep</text>
  </g>
</svg>
