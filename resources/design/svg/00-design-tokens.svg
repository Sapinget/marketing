    </g>

    <!-- r=16 -->
    <g id="Radius/16">
      <rect x="144" y="682" width="48" height="48" rx="16" fill="#eef0ff" stroke="#4f63ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="168" y="742" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">r=16px</text>
    </g>

    <!-- r=20 -->
    <g id="Radius/20">
      <rect x="204" y="682" width="48" height="48" rx="20" fill="#eef0ff" stroke="#4f63ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="228" y="742" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">r=20px</text>
