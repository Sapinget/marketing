    <g id="Swatch/Danger">
      <rect x="760" y="52" width="80" height="80" rx="12" fill="#ef4444"/>
      <text x="800" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">danger</text>
      <text x="800" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#ef4444</text>
    </g>

    <!-- Swatch 10: success #22c55e -->
    <g id="Swatch/Success">
      <rect x="852" y="52" width="80" height="80" rx="12" fill="#22c55e"/>
      <text x="892" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">success</text>
      <text x="892" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#22c55e</text>
    </g>

    <!-- Swatch 11: info #3b82f6 -->
    <g id="Swatch/Info">
      <rect x="944" y="52" width="80" height="80" rx="12" fill="#3b82f6"/>
      <text x="984" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">info</text>
      <text x="984" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#3b82f6</text>
    </g>

    <!-- Swatch 12: warning #f97316 -->
    <g id="Swatch/Warning">
      <rect x="1036" y="52" width="80" height="80" rx="12" fill="#f97316"/>
      <text x="1076" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">warning</text>
