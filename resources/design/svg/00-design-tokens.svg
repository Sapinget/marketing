<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Artboard background -->
  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- SECTION 1 — COLOR TOKENS                                  -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g id="Section/ColorTokens">
    <text x="24" y="40" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1" font-family="system-ui, -apple-system, sans-serif">COLOR TOKENS</text>

    <!-- Swatch 1: accent #4f63ff -->
    <g id="Swatch/Accent">
      <rect x="24" y="52" width="80" height="80" rx="12" fill="#4f63ff"/>
      <text x="64" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">accent</text>
      <text x="64" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#4f63ff</text>
    </g>

    <!-- Swatch 2: accent-dark #3d4fd6 -->
    <g id="Swatch/AccentDark">
      <rect x="116" y="52" width="80" height="80" rx="12" fill="#3d4fd6"/>
      <text x="156" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">accent-dark</text>
      <text x="156" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#3d4fd6</text>
    </g>

    <!-- Swatch 3: accent-tint #eef0ff (border) -->
    <g id="Swatch/AccentTint">
      <rect x="208" y="52" width="80" height="80" rx="12" fill="#eef0ff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="248" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">accent-tint</text>
      <text x="248" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#eef0ff</text>
    </g>

    <!-- Swatch 4: card #ffffff (border) -->
    <g id="Swatch/Card">
      <rect x="300" y="52" width="80" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="340" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">card</text>
      <text x="340" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#ffffff</text>
    </g>

    <!-- Swatch 5: bg #f8fafc (border) -->
    <g id="Swatch/BG">
      <rect x="392" y="52" width="80" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="432" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">bg</text>
      <text x="432" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#f8fafc</text>
    </g>

    <!-- Swatch 6: text #0f172a -->
    <g id="Swatch/Text">
      <rect x="484" y="52" width="80" height="80" rx="12" fill="#0f172a"/>
      <text x="524" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">text</text>
      <text x="524" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#0f172a</text>
