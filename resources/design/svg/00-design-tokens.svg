    <!-- Swatch 7: muted #94a3b8 -->
    <g id="Swatch/Muted">
      <rect x="576" y="52" width="80" height="80" rx="12" fill="#94a3b8"/>
      <text x="616" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">muted</text>
      <text x="616" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#94a3b8</text>
    </g>

    <!-- Swatch 8: line #e2e8f0 (border) -->
    <g id="Swatch/Line">
      <rect x="668" y="52" width="80" height="80" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
      <text x="708" y="148" font-size="9" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">line</text>
      <text x="708" y="159" font-size="8" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">#e2e8f0</text>
