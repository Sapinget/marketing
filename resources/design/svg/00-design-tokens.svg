    </g>

    <!-- Heading Small 14px SemiBold -->
    <g id="Type/HeadingSmall">
      <text x="24" y="300" font-size="14" font-weight="600" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif">Heading Small — 14px / SemiBold</text>
      <text x="560" y="297" font-size="9" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">14px · weight 600</text>
    </g>

    <!-- Body 12px Regular -->
    <g id="Type/Body">
      <text x="24" y="320" font-size="12" font-weight="400" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif">Body — 12px / Regular</text>
      <text x="560" y="318" font-size="9" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">12px · weight 400</text>
    </g>

    <!-- Body Small 11px Regular -->
    <g id="Type/BodySmall">
      <text x="24" y="338" font-size="11" font-weight="400" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif">Body Small — 11px / Regular</text>
      <text x="560" y="336" font-size="9" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">11px · weight 400</text>
    </g>

    <!-- Overline 10px 600 Tracked -->
    <g id="Type/Overline">
      <text x="24" y="356" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.8" font-family="system-ui, -apple-system, sans-serif">OVERLINE — 10px / 600 TRACKED</text>
      <text x="560" y="354" font-size="9" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">10px · weight 600 · ls 0.8</text>
    </g>

    <!-- Micro 9px 600 Tracked -->
    <g id="Type/Micro">
      <text x="24" y="372" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.6" font-family="system-ui, -apple-system, sans-serif">MICRO — 9px / 600 TRACKED</text>
      <text x="560" y="370" font-size="9" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">9px · weight 600 · ls 0.6</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="390" x2="1176" y2="390" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
