      <rect x="24" y="682" width="48" height="48" rx="8" fill="#eef0ff" stroke="#4f63ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="48" y="742" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">r=8px</text>
