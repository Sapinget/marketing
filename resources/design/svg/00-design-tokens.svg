      <rect x="112" y="596" width="20" height="20" fill="#4f63ff" fill-opacity="0.15" stroke="#4f63ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="122" y="628" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">20px</text>
    </g>

