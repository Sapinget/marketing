      <text x="560" y="222" font-size="9" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">24px · weight 700</text>
    </g>

    <!-- Display Small 20px Bold -->
    <g id="Type/DisplaySmall">
      <text x="24" y="254" font-size="20" font-weight="700" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif">Display Small — 20px / Bold</text>
      <text x="560" y="250" font-size="9" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">20px · weight 700</text>
    </g>

    <!-- Heading Large 16px SemiBold -->
    <g id="Type/HeadingLarge">
