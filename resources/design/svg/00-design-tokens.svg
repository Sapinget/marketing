      <text x="292" y="628" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">40px</text>
    </g>

    <!-- 44px box — x=324 -->
    <g id="Spacing/44">
      <rect x="324" y="572" width="44" height="44" fill="#4f63ff" fill-opacity="0.15" stroke="#4f63ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="346" y="628" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">44px</text>
    </g>

    <!-- 48px box — x=380 -->
    <g id="Spacing/48">
      <rect x="380" y="568" width="48" height="48" fill="#4f63ff" fill-opacity="0.15" stroke="#4f63ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="404" y="628" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">48px</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="648" x2="1176" y2="648" stroke="#e2e8f0" stroke-width="1"/>

