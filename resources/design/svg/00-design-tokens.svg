    <g id="Radius/32">
      <rect x="384" y="682" width="48" height="48" rx="32" fill="#eef0ff" stroke="#4f63ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="408" y="742" font-size="8" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">r=32px</text>
