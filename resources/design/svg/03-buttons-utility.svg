<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">

  <!-- Artboard background -->
  <rect width="900" height="560" fill="#f8fafc"/>
  <rect width="900" height="560" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SECTION A: ICON UTILITY BUTTON             -->
  <!-- ═══════════════════════════════════════════ -->

  <text x="24" y="24" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="0.5">ICON UTILITY BUTTON — 32×32px · radius=8px</text>

  <!-- Column headers -->
  <text x="56"  y="56" font-size="9" fill="#94a3b8" text-anchor="middle">Default</text>
  <text x="256" y="56" font-size="9" fill="#94a3b8" text-anchor="middle">Bordered</text>
  <text x="456" y="56" font-size="9" fill="#94a3b8" text-anchor="middle">Round</text>
  <text x="656" y="56" font-size="9" fill="#94a3b8" text-anchor="middle">Danger</text>

  <!-- Row labels -->
  <text x="8" y="82"  font-size="9" fill="#94a3b8" writing-mode="horizontal-tb">Default</text>
  <text x="8" y="154" font-size="9" fill="#94a3b8">Hover</text>
  <text x="8" y="226" font-size="9" fill="#94a3b8">Active</text>
  <text x="8" y="298" font-size="9" fill="#94a3b8">Disabled</text>

  <!-- ─── COL 1: Default (no border) ─── -->

  <!-- Default / Default -->
  <g id="IconBtn/Default/Default">
    <rect x="40" y="64" width="32" height="32" rx="8" fill="transparent"/>
    <rect x="55" y="78" width="2" height="12" fill="#64748b"/>
    <rect x="49" y="84" width="12" height="2" fill="#64748b"/>
  </g>
  <text x="56" y="104" font-size="8" fill="#94a3b8" text-anchor="middle">Default</text>

  <!-- Default / Hover -->
  <g id="IconBtn/Default/Hover">
    <rect x="40" y="136" width="32" height="32" rx="8" fill="#f1f5f9"/>
    <rect x="55" y="150" width="2" height="12" fill="#334155"/>
    <rect x="49" y="156" width="12" height="2" fill="#334155"/>
  </g>
  <text x="56" y="176" font-size="8" fill="#94a3b8" text-anchor="middle">Hover</text>

  <!-- Default / Active -->
  <g id="IconBtn/Default/Active">
    <rect x="40" y="208" width="32" height="32" rx="8" fill="#e2e8f0"/>
    <rect x="55" y="222" width="2" height="12" fill="#334155"/>
    <rect x="49" y="228" width="12" height="2" fill="#334155"/>
  </g>
  <text x="56" y="248" font-size="8" fill="#94a3b8" text-anchor="middle">Active</text>

  <!-- Default / Disabled -->
  <g id="IconBtn/Default/Disabled" opacity="0.4">
    <rect x="40" y="280" width="32" height="32" rx="8" fill="transparent"/>
    <rect x="55" y="294" width="2" height="12" fill="#64748b"/>
    <rect x="49" y="300" width="12" height="2" fill="#64748b"/>
  </g>
  <text x="56" y="320" font-size="8" fill="#94a3b8" text-anchor="middle" opacity="0.4">Disabled</text>

  <!-- ─── COL 2: Bordered ─── -->

  <!-- Bordered / Default -->
  <g id="IconBtn/Bordered/Default">
    <rect x="240" y="64" width="32" height="32" rx="8" fill="transparent" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="255" y="78" width="2" height="12" fill="#64748b"/>
    <rect x="249" y="84" width="12" height="2" fill="#64748b"/>
  </g>
  <text x="256" y="104" font-size="8" fill="#94a3b8" text-anchor="middle">Default</text>

