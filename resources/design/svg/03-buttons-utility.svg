  <g id="IconBtn/Bordered/Hover">
    <rect x="240" y="136" width="32" height="32" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="255" y="150" width="2" height="12" fill="#334155"/>
    <rect x="249" y="156" width="12" height="2" fill="#334155"/>
  </g>
  <text x="256" y="176" font-size="8" fill="#94a3b8" text-anchor="middle">Hover</text>

  <!-- Bordered / Active -->
  <g id="IconBtn/Bordered/Active">
    <rect x="240" y="208" width="32" height="32" rx="8" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="255" y="222" width="2" height="12" fill="#334155"/>
    <rect x="249" y="228" width="12" height="2" fill="#334155"/>
  </g>
  <text x="256" y="248" font-size="8" fill="#94a3b8" text-anchor="middle">Active</text>

  <!-- Bordered / Disabled -->
  <g id="IconBtn/Bordered/Disabled" opacity="0.4">
    <rect x="240" y="280" width="32" height="32" rx="8" fill="transparent" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="255" y="294" width="2" height="12" fill="#64748b"/>
    <rect x="249" y="300" width="12" height="2" fill="#64748b"/>
  </g>
  <text x="256" y="320" font-size="8" fill="#94a3b8" text-anchor="middle" opacity="0.4">Disabled</text>

  <!-- ─── COL 3: Round (rx=16) ─── -->

  <!-- Round / Default -->
  <g id="IconBtn/Round/Default">
    <rect x="440" y="64" width="32" height="32" rx="16" fill="transparent"/>
    <rect x="455" y="78" width="2" height="12" fill="#64748b"/>
    <rect x="449" y="84" width="12" height="2" fill="#64748b"/>
  </g>
  <text x="456" y="104" font-size="8" fill="#94a3b8" text-anchor="middle">Default</text>

  <!-- Round / Hover -->
  <g id="IconBtn/Round/Hover">
    <rect x="440" y="136" width="32" height="32" rx="16" fill="#f1f5f9"/>
    <rect x="455" y="150" width="2" height="12" fill="#334155"/>
    <rect x="449" y="156" width="12" height="2" fill="#334155"/>
  </g>
  <text x="456" y="176" font-size="8" fill="#94a3b8" text-anchor="middle">Hover</text>

  <!-- Round / Active -->
  <g id="IconBtn/Round/Active">
    <rect x="440" y="208" width="32" height="32" rx="16" fill="#e2e8f0"/>
    <rect x="455" y="222" width="2" height="12" fill="#334155"/>
    <rect x="449" y="228" width="12" height="2" fill="#334155"/>
  </g>
  <text x="456" y="248" font-size="8" fill="#94a3b8" text-anchor="middle">Active</text>

  <!-- Round / Disabled -->
  <g id="IconBtn/Round/Disabled" opacity="0.4">
    <rect x="440" y="280" width="32" height="32" rx="16" fill="transparent"/>
    <rect x="455" y="294" width="2" height="12" fill="#64748b"/>
    <rect x="449" y="300" width="12" height="2" fill="#64748b"/>
  </g>
  <text x="456" y="320" font-size="8" fill="#94a3b8" text-anchor="middle" opacity="0.4">Disabled</text>

  <!-- ─── COL 4: Danger ─── -->

  <!-- Danger / Default -->
  <g id="IconBtn/Danger/Default">
    <rect x="640" y="64" width="32" height="32" rx="8" fill="transparent"/>
    <rect x="655" y="78" width="2" height="12" fill="#64748b"/>
    <rect x="649" y="84" width="12" height="2" fill="#64748b"/>
  </g>
  <text x="656" y="104" font-size="8" fill="#94a3b8" text-anchor="middle">Default</text>

  <!-- Danger / Hover -->
  <g id="IconBtn/Danger/Hover">
    <rect x="640" y="136" width="32" height="32" rx="8" fill="#fef2f2"/>
    <rect x="655" y="150" width="2" height="12" fill="#ef4444"/>
    <rect x="649" y="156" width="12" height="2" fill="#ef4444"/>
  </g>
  <text x="656" y="176" font-size="8" fill="#94a3b8" text-anchor="middle">Hover</text>

  <!-- Danger / Active -->
  <g id="IconBtn/Danger/Active">
