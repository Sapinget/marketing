<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow-sm">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-md">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-xl">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="modal-clip">
      <rect x="56" y="80" width="480" height="640" rx="32"/>
    </clipPath>
    <linearGradient id="backdrop-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(15,23,42,0)" />
      <stop offset="20%" stop-color="rgba(15,23,42,0.4)" />
      <stop offset="80%" stop-color="rgba(15,23,42,0.4)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0)" />
    </linearGradient>
  </defs>

  <!-- Artboard background -->
  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- Page title -->
  <text x="24" y="36" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="1">MODAL ANATOMY</text>
  <text x="24" y="52" font-size="10" fill="#94a3b8">Design system · Laravel Dashboard · PPP</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LEFT SIDE: FULL MODAL BREAKDOWN -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Backdrop overlay (faded at edges) -->
  <rect x="0" y="64" width="600" height="736" fill="url(#backdrop-fade)" opacity="0.6"/>

  <!-- Modal surface -->
  <g id="Component/ModalDialogSurface">
    <rect x="56" y="80" width="480" height="640" rx="32" fill="#ffffff" filter="url(#shadow-xl)"/>

    <!-- ── A. MODAL HEADER BAR ── -->
    <g id="Component/ModalHeaderBar">
      <!-- Header background (top-rounded) -->
      <rect x="56" y="80" width="480" height="72" fill="#ffffff"/>
      <!-- Header bottom border -->
      <line x1="56" y1="152" x2="536" y2="152" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Header icon box -->
      <g id="Component/ModalHeaderIcon">
        <rect x="76" y="96" width="40" height="40" rx="10" fill="#eef0ff"/>
        <!-- Icon placeholder (grid/chart shape) -->
        <rect x="86" y="106" width="8" height="14" rx="2" fill="#4f63ff"/>
        <rect x="97" y="112" width="8" height="8" rx="2" fill="#4f63ff" opacity="0.6"/>
        <rect x="108" y="109" width="8" height="11" rx="2" fill="#4f63ff" opacity="0.8"/>
      </g>

      <!-- Modal title -->
      <text x="128" y="113" font-size="14" font-weight="700" fill="#0f172a">Tambah Data Program</text>
      <!-- Modal subtitle -->
      <text x="128" y="130" font-size="10" fill="#94a3b8">Isi form berikut untuk menambah program baru</text>

      <!-- Close button -->
      <g id="Component/ModalCloseButton">
        <rect x="488" y="95" width="32" height="32" rx="8" fill="#f1f5f9"/>
        <text x="504" y="115" font-size="13" fill="#64748b" text-anchor="middle" font-weight="400">✕</text>
      </g>
    </g>

    <!-- ── B. SCROLL CONTENT AREA ── -->
    <g id="Component/ModalScrollContent">
      <!-- Scroll area bg -->
      <rect x="56" y="152" width="480" height="496" fill="#f8fafc"/>

      <!-- ─ Section 1: Informasi Dasar ─ -->
      <g id="Component/FormSectionCard-1">
        <rect x="76" y="168" width="440" height="152" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Section title -->
        <text x="96" y="190" font-size="11" font-weight="700" fill="#0f172a">Informasi Dasar</text>
        <text x="96" y="204" font-size="10" fill="#94a3b8">Detail program yang akan dijalankan</text>

        <!-- Form field 1 -->
        <text x="96" y="224" font-size="10" font-weight="600" fill="#475569">Nama Program</text>
        <rect x="96" y="230" width="400" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="108" y="254" font-size="11" fill="#94a3b8">Masukkan nama program…</text>

        <!-- Form field 2 -->
        <text x="96" y="280" font-size="10" font-weight="600" fill="#475569">Kategori</text>
        <rect x="96" y="286" width="400" height="22" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" opacity="0.6"/>
      </g>

      <!-- ─ Section 2: Detail Program ─ -->
      <g id="Component/FormSectionCard-2">
        <rect x="76" y="332" width="440" height="136" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

        <text x="96" y="354" font-size="11" font-weight="700" fill="#0f172a">Detail Program</text>
        <text x="96" y="368" font-size="10" fill="#94a3b8">Pilih target dan periode</text>

        <!-- Select trigger -->
        <text x="96" y="388" font-size="10" font-weight="600" fill="#475569">Platform</text>
        <rect x="96" y="394" width="400" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="108" y="418" font-size="11" fill="#94a3b8">Pilih platform…</text>
        <!-- Chevron -->
        <text x="478" y="418" font-size="10" fill="#94a3b8" text-anchor="middle">▾</text>

        <!-- Textarea placeholder -->
        <rect x="96" y="440" width="400" height="20" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" opacity="0.5"/>
      </g>

      <!-- ─ Section 3: placeholder ─ -->
      <g id="Component/FormSectionCard-3">
        <rect x="76" y="480" width="440" height="80" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" opacity="0.5"/>
        <rect x="96" y="496" width="140" height="10" rx="4" fill="#e2e8f0"/>
        <rect x="96" y="514" width="400" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" opacity="0.6"/>
      </g>

      <!-- Scroll indicator -->
      <rect x="530" y="168" width="4" height="160" rx="2" fill="#e2e8f0"/>
      <rect x="530" y="168" width="4" height="48" rx="2" fill="#94a3b8"/>
    </g>

    <!-- ── C. MODAL FOOTER BAR ── -->
    <g id="Component/ModalFooterBar">
      <rect x="56" y="648" width="480" height="72" fill="#ffffff"/>
      <!-- Footer top border -->
      <line x1="56" y1="648" x2="536" y2="648" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Footer actions -->
      <g id="Component/ModalFooterActions">
        <!-- Primary CTA: Batal -->
        <rect x="344" y="664" width="80" height="36" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
        <text x="384" y="687" font-size="12" fill="#475569" font-weight="600" text-anchor="middle">Batal</text>

        <!-- Primary CTA: Simpan -->
        <rect x="436" y="664" width="84" height="36" rx="10" fill="#4f63ff"/>
        <text x="478" y="687" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Simpan</text>
      </g>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ANATOMY ANNOTATION LINES & LABELS -->
  <!-- ═══════════════════════════════════════════════ -->
  <g id="Annotations/ModalAnatomy" fill="none" font-size="10" font-weight="500">

    <!-- modal-dialog-surface annotation -->
    <line x1="540" y1="370" x2="570" y2="370" stroke="#4f63ff" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="574" y="374" font-size="9" fill="#4f63ff" font-weight="600">modal-dialog-surface</text>
    <line x1="536" y1="370" x2="540" y2="370" stroke="#4f63ff" stroke-width="1"/>
    <circle cx="536" cy="370" r="2.5" fill="#4f63ff"/>

    <!-- radius-dialog annotation -->
    <path d="M56,112 Q56,80 88,80" stroke="#4f63ff" stroke-width="1" stroke-dasharray="3,2" fill="none"/>
    <line x1="40" y1="80" x2="56" y2="80" stroke="#4f63ff" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="8" y="76" font-size="9" fill="#4f63ff" font-weight="600">radius-dialog</text>
    <text x="8" y="86" font-size="9" fill="#4f63ff">= 32px</text>

    <!-- modal-header-bar annotation -->
    <line x1="540" y1="116" x2="570" y2="116" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="574" y="120" font-size="9" fill="#64748b" font-weight="600">modal-header-bar</text>
    <circle cx="536" cy="116" r="2.5" fill="#64748b"/>

    <!-- modal-header-icon annotation -->
    <line x1="96" y1="76" x2="96" y2="64" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="60" y="62" font-size="9" fill="#64748b" font-weight="600">modal-header-icon</text>

    <!-- form-section-card annotation -->
    <line x1="540" y1="244" x2="570" y2="244" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="574" y="248" font-size="9" fill="#64748b" font-weight="600">form-section-card</text>
    <circle cx="536" cy="244" r="2.5" fill="#64748b"/>

    <!-- modal-footer-bar annotation -->
    <line x1="540" y1="684" x2="570" y2="684" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="574" y="688" font-size="9" fill="#64748b" font-weight="600">modal-footer-bar</text>
    <circle cx="536" cy="684" r="2.5" fill="#64748b"/>

    <!-- modal-footer-actions annotation -->
    <line x1="440" y1="720" x2="440" y2="740" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="386" y="753" font-size="9" fill="#64748b" font-weight="600">modal-footer-actions</text>

    <!-- backdrop annotation -->
    <line x1="20" y1="400" x2="40" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="4" y="398" font-size="8" fill="#94a3b8">backdrop</text>
    <text x="4" y="408" font-size="8" fill="#94a3b8">rgba(15,23,42,0.4)</text>
  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- RIGHT SIDE: WIDTH VARIANTS -->
  <!-- ═══════════════════════════════════════════════ -->
  <g id="Section/WidthVariants">
    <text x="620" y="70" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.5">MODAL WIDTH VARIANTS</text>

    <!-- Variant 1: Compact 28rem = 224px -->
    <g id="Component/Modal-Width-Compact">
      <text x="620" y="92" font-size="9" fill="#94a3b8">compact · 28rem · 448px</text>
      <!-- Modal shell -->
      <rect x="620" y="98" width="448" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-sm)"/>
      <!-- Header bar -->
      <rect x="620" y="98" width="448" height="32" rx="16" fill="#f8fafc"/>
      <rect x="620" y="114" width="448" height="16" fill="#f8fafc"/>
      <line x1="620" y1="130" x2="1068" y2="130" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Header content skeleton -->
      <rect x="636" y="110" width="24" height="12" rx="4" fill="#e2e8f0"/>
      <rect x="668" y="108" width="80" height="8" rx="3" fill="#e2e8f0"/>
      <rect x="668" y="120" width="140" height="6" rx="3" fill="#f1f5f9"/>
      <!-- close btn placeholder -->
      <rect x="1036" y="107" width="16" height="16" rx="4" fill="#f1f5f9"/>
      <!-- Scroll area dotted -->
      <line x1="636" y1="148" x2="1052" y2="148" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- Footer bar -->
      <line x1="620" y1="158" x2="1068" y2="158" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="968" y="161" width="48" height="10" rx="4" fill="#f1f5f9"/>
      <rect x="1022" y="161" width="40" height="10" rx="4" fill="#4f63ff"/>
    </g>

    <!-- Variant 2: Form 44rem -->
    <g id="Component/Modal-Width-Form">
      <text x="620" y="198" font-size="9" fill="#94a3b8">form · 44rem · 704px — shown clipped</text>
      <rect x="620" y="204" width="448" height="76" rx="16" fill="#ffffff" stroke="#4f63ff" stroke-width="1.5" filter="url(#shadow-sm)"/>
      <rect x="620" y="204" width="448" height="32" rx="16" fill="#eef0ff"/>
      <rect x="620" y="220" width="448" height="16" fill="#eef0ff"/>
      <line x1="620" y1="236" x2="1068" y2="236" stroke="#c7d2fe" stroke-width="1"/>
      <rect x="636" y="216" width="24" height="12" rx="4" fill="#a5b4fc"/>
      <rect x="668" y="214" width="100" height="8" rx="3" fill="#a5b4fc"/>
      <rect x="668" y="226" width="160" height="6" rx="3" fill="#c7d2fe"/>
      <rect x="1036" y="213" width="16" height="16" rx="4" fill="#eef0ff"/>
      <text x="844" y="258" font-size="9" fill="#4f63ff" text-anchor="middle" font-weight="600">← active / recommended →</text>
      <line x1="620" y1="264" x2="1068" y2="264" stroke="#c7d2fe" stroke-width="1"/>
      <rect x="968" y="267" width="48" height="10" rx="4" fill="#eef0ff"/>
      <rect x="1022" y="267" width="40" height="10" rx="4" fill="#4f63ff"/>
    </g>

    <!-- Variant 3: Detail 56rem -->
    <g id="Component/Modal-Width-Detail">
      <text x="620" y="306" font-size="9" fill="#94a3b8">detail · 56rem · 896px — shown clipped to artboard</text>
      <rect x="620" y="312" width="448" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-sm)"/>
      <rect x="620" y="312" width="448" height="32" rx="16" fill="#f8fafc"/>
      <rect x="620" y="328" width="448" height="16" fill="#f8fafc"/>
      <line x1="620" y1="344" x2="1068" y2="344" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="636" y="324" width="24" height="12" rx="4" fill="#e2e8f0"/>
      <rect x="668" y="322" width="110" height="8" rx="3" fill="#e2e8f0"/>
      <rect x="668" y="334" width="170" height="6" rx="3" fill="#f1f5f9"/>
      <rect x="1036" y="321" width="16" height="16" rx="4" fill="#f1f5f9"/>
      <line x1="620" y1="372" x2="1068" y2="372" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="968" y="375" width="48" height="10" rx="4" fill="#f1f5f9"/>
      <rect x="1022" y="375" width="40" height="10" rx="4" fill="#4f63ff"/>
    </g>

    <!-- Variant 4: Wide 72rem -->
    <g id="Component/Modal-Width-Wide">
      <text x="620" y="414" font-size="9" fill="#94a3b8">wide · 72rem · full — shown as scaled preview</text>
      <rect x="620" y="420" width="448" height="76" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-sm)"/>
      <rect x="620" y="420" width="448" height="32" rx="16" fill="#f8fafc"/>
      <rect x="620" y="436" width="448" height="16" fill="#f8fafc"/>
      <line x1="620" y1="452" x2="1068" y2="452" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="636" y="432" width="24" height="12" rx="4" fill="#e2e8f0"/>
      <rect x="668" y="430" width="120" height="8" rx="3" fill="#e2e8f0"/>
      <rect x="668" y="442" width="180" height="6" rx="3" fill="#f1f5f9"/>
      <rect x="1036" y="429" width="16" height="16" rx="4" fill="#f1f5f9"/>
      <line x1="620" y1="480" x2="1068" y2="480" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="968" y="483" width="48" height="10" rx="4" fill="#f1f5f9"/>
      <rect x="1022" y="483" width="40" height="10" rx="4" fill="#4f63ff"/>
    </g>

    <!-- Token table -->
    <g id="Section/TokenTable">
      <text x="620" y="530" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.5">SPACING &amp; RADIUS TOKENS</text>

      <!-- Table rows -->
      <rect x="620" y="538" width="448" height="28" rx="0" fill="#f1f5f9"/>
      <text x="632" y="556" font-size="9" font-weight="700" fill="#64748b">Token</text>
      <text x="800" y="556" font-size="9" font-weight="700" fill="#64748b">Value</text>
      <text x="920" y="556" font-size="9" font-weight="700" fill="#64748b">Usage</text>

      <line x1="620" y1="566" x2="1068" y2="566" stroke="#e2e8f0" stroke-width="1"/>

      <text x="632" y="582" font-size="9" fill="#0f172a" font-weight="500">radius-dialog</text>
      <text x="800" y="582" font-size="9" fill="#4f63ff">32px</text>
      <text x="920" y="582" font-size="9" fill="#64748b">Modal container</text>
      <line x1="620" y1="590" x2="1068" y2="590" stroke="#f1f5f9" stroke-width="1"/>

      <text x="632" y="606" font-size="9" fill="#0f172a" font-weight="500">radius-section-card</text>
      <text x="800" y="606" font-size="9" fill="#4f63ff">16px</text>
      <text x="920" y="606" font-size="9" fill="#64748b">Form sections inside</text>
      <line x1="620" y1="614" x2="1068" y2="614" stroke="#f1f5f9" stroke-width="1"/>

      <text x="632" y="630" font-size="9" fill="#0f172a" font-weight="500">modal-header-height</text>
      <text x="800" y="630" font-size="9" fill="#4f63ff">72px</text>
      <text x="920" y="630" font-size="9" fill="#64748b">Fixed header</text>
      <line x1="620" y1="638" x2="1068" y2="638" stroke="#f1f5f9" stroke-width="1"/>

      <text x="632" y="654" font-size="9" fill="#0f172a" font-weight="500">modal-footer-height</text>
      <text x="800" y="654" font-size="9" fill="#4f63ff">72px</text>
      <text x="920" y="654" font-size="9" fill="#64748b">Fixed footer</text>
      <line x1="620" y1="662" x2="1068" y2="662" stroke="#f1f5f9" stroke-width="1"/>

      <text x="632" y="678" font-size="9" fill="#0f172a" font-weight="500">padding-modal-x</text>
      <text x="800" y="678" font-size="9" fill="#4f63ff">20px</text>
      <text x="920" y="678" font-size="9" fill="#64748b">Horizontal padding</text>
      <line x1="620" y1="686" x2="1068" y2="686" stroke="#f1f5f9" stroke-width="1"/>

      <text x="632" y="702" font-size="9" fill="#0f172a" font-weight="500">z-index-modal</text>
      <text x="800" y="702" font-size="9" fill="#4f63ff">50</text>
      <text x="920" y="702" font-size="9" fill="#64748b">Above backdrop (40)</text>

      <rect x="620" y="538" width="448" height="168" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </g>
  </g>
</svg>
